
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>48 Pico</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #final {
      display: none;
      position: fixed;
      inset: 0;
      padding: 24px;
      background: #101820;
      color: white;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #final h1 {
      font-size: clamp(28px, 6vw, 46px);
      margin-bottom: 12px;
    }
    #final p {
      font-size: clamp(18px, 4vw, 24px);
      line-height: 1.5;
      max-width: 600px;
    }
    .whatsapp {
      display: inline-block;
      margin-top: 24px;
      padding: 18px 28px;
      background: #25D366;
      color: white;
      border-radius: 12px;
      font-size: 19px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div id="player"></div>

  <div id="final">
    <h1>Pensa em comprar ou vender?</h1>
    <p>
      Fale comigo agora mesmo e tenha a experiência
      do melhor atendimento!
    </p>
    <a class="whatsapp"
       href="https://wa.me/351915892555?text=Ol%C3%A1%2C%20vi%20o%20seu%20v%C3%ADdeo%20no%2048%20Pico%20e%20gostaria%20de%20falar%20consigo.">
      Falar comigo no WhatsApp
    </a>
  </div>

  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    var player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'MgUYUUWWy_M',
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          rel: 0,
          cc_load_policy: 0
        },
        events: {
          onStateChange: function(event) {
            if (event.data === YT.PlayerState.ENDED) {
              document.getElementById('player').style.display = 'none';
              document.getElementById('final').style.display = 'flex';
            }
          }
        }
      });
    }
  </script>

</body>
</html>
