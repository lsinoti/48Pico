
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>48 Pico</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Vídeo */
    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Mensagem sobre o vídeo */
    #convite {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 18px 16px 24px;
      background: rgba(16, 24, 32, 0.94);
      color: white;
      text-align: center;
      z-index: 10;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
    }

    #convite h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    #convite p {
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
    }

    /* Botão WhatsApp */
    .whatsapp {
      display: inline-block;
      margin-top: 16px;
      padding: 15px 24px;
      background: #25D366;
      color: white;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }

    #convite .whatsapp {
      margin-top: 12px;
      padding: 13px 20px;
      font-size: 16px;
    }

    /* Tela após o vídeo */
    #final {
      display: none;
      position: fixed;
      inset: 0;
      padding: 24px;
      background: #101820;
      color: white;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 20;
    }

    #final h1 {
      font-size: clamp(28px, 6vw, 46px);
      margin-bottom: 12px;
    }

    #final p {
      font-size: clamp(18px, 4vw, 24px);
      line-height: 1.5;
      max-width: 600px;
    }
  </style>
</head>

<body>

  <!-- Vídeo do YouTube -->
  <div id="player"></div>

  <!-- Mensagem que aparece aos 1:52 -->
  <div id="convite">
    <h2>Pensa em comprar ou vender?</h2>

    <p>
      Fale comigo agora mesmo e tenha a experiência
      do melhor atendimento!
    </p>

    <a
      class="whatsapp"
      href="https://wa.me/351915892555?text=Ol%C3%A1%2C%20vi%20o%20seu%20v%C3%ADdeo%20no%2048%20Pico%20e%20gostaria%20de%20falar%20consigo."
      target="_blank"
      rel="noopener noreferrer"
    >
      Falar comigo no WhatsApp
    </a>
  </div>

  <!-- Tela final -->
  <div id="final">
    <h1>Pensa em comprar ou vender?</h1>

    <p>
      Fale comigo agora mesmo e tenha a experiência
      do melhor atendimento!
    </p>

    <a
      class="whatsapp"
      href="https://wa.me/351915892555?text=Ol%C3%A1%2C%20vi%20o%20seu%20v%C3%ADdeo%20no%2048%20Pico%20e%20gostaria%20de%20falar%20consigo."
      target="_blank"
      rel="noopener noreferrer"
    >
      Falar comigo no WhatsApp
    </a>
  </div>

  <script>
    // Carrega a API do YouTube
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    var player;
    var convite = document.getElementById('convite');
    var telaFinal = document.getElementById('final');

    // Momento em que a mensagem aparece:
    // 1 minuto e 52 segundos = 112 segundos
    var momentoConvite = 112;

    function mostrarTelaFinal() {
      convite.style.display = 'none';
      document.getElementById('player').style.display = 'none';
      telaFinal.style.display = 'flex';
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'MgUYUUWWy_M',

        playerVars: {
          autoplay: 1,
          playsinline: 1,
          rel: 0,
          cc_load_policy: 0,
          enablejsapi: 1
        },

        events: {
          onReady: function(event) {

            // Verifica o tempo do vídeo
            // quatro vezes por segundo
            setInterval(function() {
              if (
                player.getPlayerState() ===
                YT.PlayerState.PLAYING
              ) {
                var tempoAtual = player.getCurrentTime();

                if (tempoAtual >= momentoConvite) {
                  convite.style.display = 'block';
                } else {
                  convite.style.display = 'none';
                }
              }
            }, 250);
          },

          onStateChange: function(event) {
            if (event.data === YT.PlayerState.ENDED) {
              mostrarTelaFinal();
            }
          }
        }
      });
    }
  </script>

</body>
</html>
